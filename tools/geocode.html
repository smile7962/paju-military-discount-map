<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일괄 지오코딩 도구 — 파주 군장병 할인업소</title>
<style>
  body { font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
         max-width: 720px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; }
  button { font-size: 15px; padding: 10px 18px; border-radius: 8px; border: 1px solid #999;
           cursor: pointer; margin-right: 8px; }
  #run { background: #2f5233; color: #fff; border-color: #2f5233; }
  progress { width: 100%; height: 18px; margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 12px; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  .fail { background: #ffe3e0; }
  .note { color: #666; font-size: 13.5px; line-height: 1.6; }
</style>
</head>
<body>
<h1>🗺️ 일괄 지오코딩 도구</h1>
<p class="note">
  data/stores.json의 좌표 없는 업소 주소를 브이월드 지오코더로 일괄 변환합니다.
  완료 후 <b>「stores.json 다운로드」</b>로 받은 파일을 GitHub 저장소의
  <code>data/stores.json</code>에 덮어쓰면(웹에서 Upload files) 모든 방문자가
  지오코딩 없이 바로 지도를 볼 수 있습니다.<br>
  ※ 이 페이지는 브이월드 키에 등록된 도메인(배포 주소 또는 localhost)에서 열어야 동작합니다.
</p>

<button id="run">지오코딩 시작</button>
<button id="download" disabled>stores.json 다운로드</button>
<progress id="prog" value="0" max="1"></progress>
<div id="status">대기 중</div>
<table id="failures" hidden>
  <thead><tr><th>연번</th><th>업소명</th><th>주소 (변환 실패)</th></tr></thead>
  <tbody></tbody>
</table>

<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script>
let data = null;

async function run() {
  document.getElementById("run").disabled = true;
  const res = await fetch("../data/stores.json");
  data = await res.json();
  const stores = data.stores;
  const prog = document.getElementById("prog");
  const status = document.getElementById("status");

  await geocodeMissing(
    stores,
    (done, total) => {
      prog.max = total || 1;
      prog.value = done;
      status.textContent = `진행 ${done}/${total}`;
    },
    () => {}
  );

  const failed = stores.filter((s) => !s.lat || !s.lng);
  status.textContent = `완료 — 성공 ${stores.length - failed.length} / 실패 ${failed.length}`;
  if (failed.length) {
    const table = document.getElementById("failures");
    table.hidden = false;
    table.querySelector("tbody").innerHTML = failed.map((s) =>
      `<tr class="fail"><td>${s.id}</td><td>${s.name}</td><td>${s.addr}</td></tr>`
    ).join("");
  }
  document.getElementById("download").disabled = false;
}

function download() {
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "stores.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("run").addEventListener("click", run);
document.getElementById("download").addEventListener("click", download);
</script>
</body>
</html>
